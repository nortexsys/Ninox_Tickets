name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - name: Resolve workspace
        run: flutter pub get
      - name: Analyze
        run: dart analyze --fatal-infos

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages app/lib app/test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - name: Resolve workspace
        run: flutter pub get
      - name: Test paperdrop_core
        working-directory: packages/paperdrop_core
        run: dart test
      - name: Test ninox_client
        working-directory: packages/ninox_client
        run: dart test
      # pdfium_dart 0.3.1's loader (lib/src/pdfium_loader.dart) looks for
      # "<resolved-executable-dir>/lib/libpdfium.so" when Flutter runs on
      # Linux, which for `flutter test` is the engine artifact directory
      # under the Flutter SDK cache. That artifact is not a PDFium file and
      # `flutter precache` does not fetch one (design.md fix-ci-pdfium-runner
      # §2, option (c)): place the same PDFium build the native-assets hook
      # downloads (pdfium_dart's hook/build.dart pins "chromium/7811") there
      # before the step that runs the failing tests.
      - name: Install PDFium for the Linux test host
        run: |
          set -euo pipefail
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_ROOT_DIR="$(dirname "$(dirname "$(readlink -f "$FLUTTER_BIN")")")"
          ENGINE_LIB_DIR="$FLUTTER_ROOT_DIR/bin/cache/artifacts/engine/linux-x64/lib"
          mkdir -p "$ENGINE_LIB_DIR"
          curl -fsSL -o /tmp/pdfium-linux-x64.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz"
          tar -xzf /tmp/pdfium-linux-x64.tgz -C /tmp lib/libpdfium.so
          cp /tmp/lib/libpdfium.so "$ENGINE_LIB_DIR/libpdfium.so"
      - name: Test app with coverage
        working-directory: app
        run: flutter test --coverage
      - name: Negative release checklist (Functional 10.6, T2.4)
        working-directory: app
        run: flutter test ../validation/release_checklist
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage/lcov.info

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Core purity
        run: python .github/scripts/core_purity.py
      - name: Privacy
        run: python .github/scripts/privacy_check.py
      - name: No forbidden NINOX database id
        run: python .github/scripts/no_ninox_db_id.py
      - name: Encoding guard
        run: python .github/scripts/encoding_guard.py
      - name: Handover file (150 lines, board in sync)
        run: |
          pip install pyyaml
          python docs/Plan/scripts/plan_board.py --check
      - name: Script tests
        run: |
          pip install pytest
          python -m pytest .github/scripts/tests -q
      - name: Scenario coverage report
        run: python .github/scripts/scenario_coverage.py --out test-traceability.md
      - name: Upload traceability report
        uses: actions/upload-artifact@v4
        with:
          name: test-traceability
          path: test-traceability.md
