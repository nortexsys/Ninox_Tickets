name: paperdrop
description: Paperdrop for Ninox — reads a receipt or an invoice and writes it to a Ninox table.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^16.0.0
  crypto: ^3.0.6
  path: ^1.9.0
  path_provider: ^2.1.5
  file_picker: ^10.0.0
  paperdrop_core:
    path: ../packages/paperdrop_core
  ninox_client:
    path: ../packages/ninox_client
  share_handler: ^0.0.25
  google_mlkit_document_scanner: 0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
