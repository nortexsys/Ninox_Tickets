# Shared analyzer settings for every workspace member (setup-mvp-foundations, design §3).
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: error
    unused_local_variable: error
    dead_code: error
  exclude:
    - "**/build/**"
    - "**/.dart_tool/**"
    - agents/**
    - corpus_test/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print            # a lane that prints may print a token
    - prefer_single_quotes
    - unawaited_futures
    - prefer_final_locals
    - directives_ordering
