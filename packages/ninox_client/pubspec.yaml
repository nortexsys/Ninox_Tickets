name: ninox_client
description: >-
  The Ninox port of ADR-003 and its classic REST adapter. Pure Dart plus package:http. The team
  and database are always explicit arguments, never read from the environment.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  http: ^1.6.0
  paperdrop_core:
    path: ../paperdrop_core

dev_dependencies:
  test: ^1.25.6
